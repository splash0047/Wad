<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>E-Commerce Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-shop"></i>
            <span>ShopAdmin</span>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-link active">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="nav-link">
                <i class="bi bi-cart3"></i>
                <span>Orders</span>
            </a>
            <a href="products.html" class="nav-link">
                <i class="bi bi-box-seam"></i>
                <span>Products</span>
            </a>
            <a href="customers.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Customers</span>
            </a>
            <a href="#" class="nav-link">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <!-- Dashboard Content -->
        <div class="dashboard-content">
            <div class="d-flex align-items-center gap-3 mb-4">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title m-0">Dashboard</h1>
            </div>

            <!-- Statistics Cards -->
            <div class="row g-4">
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="card-top">
                            <div class="stat-icon icon-1">
                                <i class="bi bi-currency-dollar"></i>
                            </div>
                            <span class="stat-change positive">+12.5%</span>
                        </div>
                        <div class="stat-value">48,295</div>
                        <div class="stat-label">Total Revenue</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="card-top">
                            <div class="stat-icon icon-2">
                                <i class="bi bi-bag"></i>
                            </div>
                            <span class="stat-change positive">+8.2%</span>
                        </div>
                        <div class="stat-value">1,245</div>
                        <div class="stat-label">Total Orders</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="card-top">
                            <div class="stat-icon icon-3">
                                <i class="bi bi-people-fill"></i>
                            </div>
                            <span class="stat-change positive">+15.3%</span>
                        </div>
                        <div class="stat-value">3,842</div>
                        <div class="stat-label">Total Customers</div>
                    </div>
                </div>
                <div class="col-md-6 col-xl-3">
                    <div class="stat-card">
                        <div class="card-top">
                            <div class="stat-icon icon-4">
                                <i class="bi bi-box-seam"></i>
                            </div>
                            <span class="stat-change negative">-2.1%</span>
                        </div>
                        <div class="stat-value">856</div>
                        <div class="stat-label">Products Sold</div>
                    </div>
                </div>
            </div>

            <!--
            ============================================================
            CHARTS SECTION (Commented out - Uncomment to activate charts)
            Requires Chart.js CDN: <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
            ============================================================

            -->

            <!--

            Monthly breakdown matching dashboard revenue = 48,295

                <div class="col-lg-8">
                    <div class="content-card">
                        <div class="card-header-area">
                            <h5>Revenue & Orders Trend</h5>
                        </div>
                        <canvas id="revenueChart" height="100"></canvas>
                    </div>
                </div>
            </div>

            <script>

                // Labels represent months; data reflects orders/revenue flow
                new Chart(document.getElementById('revenueChart'), {

                        datasets: [
                            {
                                label: 'Revenue (thousands)',
                                data: [35, 38, 42, 45, 48.3],
                                borderColor: '#4f46e5',

                                fill: true,
                                tension: 0.4
                            },
                            {

                                data: [9, 9.5, 10.5, 11.5, 12.5],
                                borderColor: '#06b6d4',
                                backgroundColor: 'rgba(6, 182, 212, 0.1)',
                                fill: true,
                                tension: 0.4
                            }

            <!--
            --------------------------------------------------------
            CHART 2: Product Stock Status (Doughnut Chart)
            Data from products.html stock badges:
            In Stock = 4, Low Stock = 1, Out of Stock = 1
            --------------------------------------------------------
            <div class="row g-4 mt-2">
                <div class="col-md-6 col-lg-4">
                    <div class="content-card">
                        <div class="card-header-area">
                            <h5>Product Stock Status</h5>
                        </div>
                        <canvas id="stockChart"></canvas>
                    </div>
                </div>
            </div>

            <script>
                // Product Stock Doughnut Chart
                new Chart(document.getElementById('stockChart'), {
                    type: 'doughnut',
                    data: {
                        labels: ['In Stock', 'Low Stock', 'Out of Stock'],
                        datasets: [{
                            data: [4, 1, 1],
                            backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                            borderWidth: 0
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { position: 'bottom' } }
                    }
                });
            </script>
            -->

            <!--
            --------------------------------------------------------
            CHART 3: Customer Status Distribution (Bar Chart)
            Data from customers.html status badges:
            Active = 3, Pending = 1, Inactive = 1
            Total Customers = 3,842 as per dashboard stat card
            --------------------------------------------------------
            <div class="row g-4 mt-2">
                <div class="col-md-6 col-lg-4">
                    <div class="content-card">
                        <div class="card-header-area">
                            <h5>Customer Status</h5>
                        </div>
                        <canvas id="customerChart"></canvas>
                    </div>
                </div>
            </div>

            <script>
                // Customer Status Bar Chart
                new Chart(document.getElementById('customerChart'), {
                    type: 'bar',
                    data: {
                        labels: ['Active', 'Pending', 'Inactive'],
                        datasets: [{
                            label: 'Customers',
                            data: [3, 1, 1],
                            backgroundColor: ['#10b981', '#f59e0b', '#ef4444'],
                            borderRadius: 8
                        }]
                    },
                    options: {
                        responsive: true,
                        plugins: { legend: { display: false } },
                        scales: { y: { beginAtZero: true } }
                    }
                });
            </script>
            -->

            <!--
            ============================================================
            END OF CHARTS SECTION
            To use: add Chart.js CDN in <head> and uncomment blocks above
            ============================================================
            -->
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });

        document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 992) {
                    sidebar.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
