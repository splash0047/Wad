<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - E-Commerce Admin Dashboard</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Sidebar Overlay -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <i class="bi bi-shop"></i>
            <span>ShopAdmin</span>
        </div>
        <div class="sidebar-nav">
            <a href="index.html" class="nav-link">
                <i class="bi bi-speedometer2"></i>
                <span>Dashboard</span>
            </a>
            <a href="orders.html" class="nav-link">
                <i class="bi bi-cart3"></i>
                <span>Orders</span>
            </a>
            <a href="products.html" class="nav-link active">
                <i class="bi bi-box-seam"></i>
                <span>Products</span>
            </a>
            <a href="customers.html" class="nav-link">
                <i class="bi bi-people"></i>
                <span>Customers</span>
            </a>
            <a href="#" class="nav-link">
                <i class="bi bi-gear"></i>
                <span>Settings</span>
            </a>
        </div>
    </nav>

    <!-- Main Content -->
    <div class="main-content" id="mainContent">
        <div class="dashboard-content">
            <div class="d-flex align-items-center gap-3 mb-4">
                <button class="sidebar-toggle" id="sidebarToggle">
                    <i class="bi bi-list"></i>
                </button>
                <h1 class="page-title m-0">Products</h1>
            </div>

            <div class="content-card">
                <div class="card-header-area">
                    <h5>All Products</h5>
                    <button class="btn-action">+ Add Product</button>
                </div>
                <div class="row g-4">
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-headphones"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Wireless Headphones</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">129.99</span>
                                    <span class="status-badge instock">In Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-watch"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Smart Watch Pro</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">249.50</span>
                                    <span class="status-badge lowstock">Low Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-usb-mini"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Running Shoes</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">89.00</span>
                                    <span class="status-badge instock">In Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-speaker"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Bluetooth Speaker</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">79.99</span>
                                    <span class="status-badge outstock">Out of Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-laptop"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Laptop Stand</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">45.00</span>
                                    <span class="status-badge instock">In Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-6 col-lg-4 col-xl-3">
                        <div class="product-card">
                            <div class="product-img">
                                <i class="bi bi-mouse"></i>
                            </div>
                            <div class="product-body">
                                <div class="product-title">Gaming Mouse</div>
                                <div class="d-flex justify-content-between align-items-center mt-2">
                                    <span class="product-price">59.99</span>
                                    <span class="status-badge instock">In Stock</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap 5 JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        const sidebar = document.getElementById('sidebar');
        const sidebarToggle = document.getElementById('sidebarToggle');
        const sidebarOverlay = document.getElementById('sidebarOverlay');

        sidebarToggle.addEventListener('click', () => {
            sidebar.classList.toggle('active');
            sidebarOverlay.classList.toggle('active');
        });

        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
            sidebarOverlay.classList.remove('active');
        });

        document.querySelectorAll('.sidebar-nav .nav-link').forEach(link => {
            link.addEventListener('click', () => {
                if (window.innerWidth < 992) {
                    sidebar.classList.remove('active');
                    sidebarOverlay.classList.remove('active');
                }
            });
        });
    </script>
</body>
</html>
